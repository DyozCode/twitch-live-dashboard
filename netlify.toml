# netlify.toml — Konfiguration für das Twitch-Live-Dashboard
# ─────────────────────────────────────────────────────────────

[build]
  publish = "public"          # HTML-Dateien liegen in /public
  command = ""                # Kein Build-Schritt nötig

# Edge Function für den Twitch-Proxy
[[edge_functions]]
  path = "/api/twitch"
  function = "twitch-proxy"

# Sicherheits-Header
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
